## 参考操作流程

- 给自己在合适的位置新建一个 `SI100B` 的目录，通过 `uv init` 来初始化项目。

## 为什么要有良好的代码风格？
> There are only two hard things in Computer Science: cache invalidation and naming things.
>
>  ---Phil Karlton
- 方便自己检查 bug
- 方便合作者阅读代码
- 阅读/写出赏心悦目的代码能让人心情愉悦

<!--v-->
## 遵循 PEP 8 规范
Python 创建了一个官方的编码风格规范：[PEP 8](https://peps.python.org/pep-0008/)，以保持不同开发者编写的代码风格的一致性。

1. 使用4个空格进行缩进。
2. 每行不超过79个字符。
3. 变量命名约定：
   - 对于普通变量，使用蛇形命名法，例如：max_value.
   - 对于常量，使用全大写字母，并使用下划线连接，例如：MAX_VALUE。
   - 对于仅供内部使用的变量，在其前面添加下划线前缀，例如：_local_var。
   - 对于与 Python 关键字冲突的变量名，在变量末尾添加下划线，例如：class_。

<!--v-->
## 使用格式化工具：Ruff

- [Ruff](https://docs.astral.sh/ruff/) 是一个快速的 Python 代码检查与格式化工具，可以自动统一缩进、空格和换行等代码风格。
  - 在 Ruff 之前，Black 是最常用的格式化器，采用 PEP 8 原则的同时，制定了一套确定性的格式规则。
  - Ruff 基本兼容 Black（格式化），Flake8（代码检查）和 isort（import排序）的功能。
- 在工具中安装 Ruff，并格式化当前目录下的 Python 代码：

```bash
uv tool install ruff@latest
ruff format .
```

- 只检查代码是否需要格式化，而不修改文件：`ruff format --check .`
- VS Code 也可安装 Ruff 插件，通过“格式化文档”或“保存时格式化”自动整理代码。
- 格式化工具只负责统一排版；清晰的命名、合理的注释仍需由程序员完成。

<!--v-->
## 描述性的变量名
- 代码大量使用描述性较弱的变量名，读者将很难理解代码的含义。例如

<div style=" margin-top: 10px; margin-right: 20px; margin-left: 20px" markdown="1">

| weakly descriptive | strong descriptive | 
|:---:|:---:|
| data | file_chunks | 
| temp | pending_id | 
| result | active_menber | 
</div> 

- 一些特殊情况：
  - 数组索引 `i,j,k`
  - 一些整数 `n`
  - 一个临时字符串 `s`
  - 一个异常 `e`
  - 文件对象 `fp`

<!--v-->
## 两种最常见的命名规范
- 驼峰命名法（Camel Case）：第一个单词首字母小写，其余单词首字母答谢，此法常用于方法名:
  - firstName
  - findLocation
- 下划线命名法（Snake Case）：所有单词用下划线连接。
  - first_name
  - find_location

<!--v-->
## 善用空格
- 肉眼可利用空格快速区分代码的不同部分
- 在二元运算符（如`+`、`-`、`==`、`>` 和`=`）前后使用空格，明确区分运算符和操作数。例如：`1 + 1`，`ans += 1`
- 在 “,” 后使用空格。例如：`func(a, b, c)`

<!--v-->
## 缩进
- 可以选择使用 4 个空格（PEP8 规范）、2个空格（Google style）或 1个 tab 作为缩进方式。
- 必须在所有代码中保持相同的缩进方式
<img src="images/indentation_method.png" width="75%" style="float: middle;">


<!--v-->
## 减少无意义注释（Comment）
- 没有编译器或者解释器的相助，编写和维护注释需要更多的时间成本
- 试图通过更好的命名替代注释
```python
# HTTP response code indicates can't find the requested resource 
if stauts_code == 404:
  ...
```
```python
HTTP_NOT_FOUND = 404 
if stauts_code == HTTP_NOT_FOUND:
  ...
```
