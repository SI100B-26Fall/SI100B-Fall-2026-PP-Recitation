## 这节课要做什么

本讲把 Lecture 4 – 6 的三块内容按依赖顺序串起来。

- 近似求解（approximation）：答案无法精确求出或穷举不可行时，如何得到一个"足够接近"的结果
- 函数（functions）：把程序分解成自包含、可复用、有名字的零件
- 函数作为参数（functions as arguments）：把"做什么"当成参数传进来，把抽象层次再提高一层

<!--v-->

## 穷举枚举的三条边界

猜测—验证法（guess-and-check）靠枚举有限的整数集合来找精确答案，一旦离开这个前提就不够用。

- 可能的答案集合可以是无限的（任意正数的平方根）
- 无穷集合无法逐个试完
- 精确解可能根本不存在：`x` 不是完全平方数时，找不到整数 `r` 使 `r*r == x`

于是换一个问法：不要求精确答案，只要求<strong>足够接近</strong>。

<!--v-->

## 用容差（epsilon）定义"足够接近"

给定正数 `x`，我们要找 `r` 满足 `|r**2 - x| < epsilon`。

  <line x1="70" y1="118" x2="870" y2="118" stroke="#444" stroke-width="2"/>
  <text x="70" y="144" text-anchor="middle" font-size="15" fill="#555">0</text>

  <rect x="400" y="82" width="150" height="72" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="475" y="74" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">误差 < epsilon</text>
  <text x="475" y="126" text-anchor="middle" font-size="16" fill="#1b5e20">√x 附近</text>
  <circle cx="250" cy="118" r="5" fill="#c62828"/>
  <text x="250" y="144" text-anchor="middle" font-size="15" fill="#c62828">猜得偏小，继续加</text>
  <circle cx="700" cy="118" r="5" fill="#c62828"/>
  <text x="700" y="144" text-anchor="middle" font-size="15" fill="#c62828">猜得偏大，跨过了</text>
  <text x="470" y="186" text-anchor="middle" font-size="15" fill="#333">不要求 r² 正好等于 x，只要求 |r² − x| 落进这条绿色带里</text>
</svg>

- <strong>容差（epsilon）</strong>是我们自己定的精度上限，不是一个固定常数
- 判据写成 `abs(guess**2 - x) >= epsilon` 就是"还不够近，继续试"
- 这样就把"求平方根"变成"让误差降到容差以内"的循环问题

<!--v-->

## 增量逼近：三步走的算法

1. 从 `guess = 0.0` 出发
2. 每次让 `guess` 增加一个很小的量 `increment`（步长）
3. 每轮检查 `abs(guess**2 - x) >= epsilon`，不满足就继续加

```python
x = 36
epsilon = 0.01
num_guesses = 0
guess = 0.0
increment = 0.0001

while abs(guess**2 - x) >= epsilon:
    guess += increment
    num_guesses += 1

print('num_guesses =', num_guesses)
print(guess, 'is close to square root of', x)
```

`x = 36` 时 `guess` 接近 6（实测 `5.9992`），代价是约 6 万次猜测（实测 `59992` 次）。

<!--v-->

## 先用最小例子看清机制

把 `x` 换成完全平方数 25、步长取 `0.01`，猜测过程一眼能看完：

<div class="three-line">

| guess | guess**2 | abs(guess**2 - 25) | 是否停止 |
|:---:|:---:|:---:|:---|
| 4.00 | 16.00 | 9.00 | 继续 |
| 4.50 | 20.25 | 4.75 | 继续 |
| 4.90 | 24.01 | 0.99 | 继续 |
| 4.99 | 24.9001 | 0.0999 | 继续 |
| 5.00 | 25.00 | 0.00 | 停止（误差小于 epsilon）|

</div>

误差随 `guess` 增大而变小，直到落进 `epsilon = 0.01` 以内。所谓近似求解，就是让这个误差逐步贴近 0。

<!--v-->

## 参数怎么选：效率与精度的取舍

<div class="three-line">

| 调整 | 程序速度 | 结果精度 |
|:---|:---|:---|
| 步长 `increment` 变小 | 更慢 | 更可能拿到好结果 |
| 步长 `increment` 变大 | 更快 | 可能直接跨过答案 |
| 容差 `epsilon` 变大 | 更快 | 结果更粗糙 |
| 容差 `epsilon` 变小 | 更慢 | 结果更精确 |

</div>

两个参数一起决定"猜多少次、猜多准"。设置参数时先问自己：这道题要求的精度到底是多少。

<!--v-->

## 反例：猜测越过答案之后

把 `x` 换成 `54321`，其余参数不变，循环<strong>不会退出</strong>。

```python
x = 54321
epsilon = 0.01
numGuesses = 0
guess = 0.0
increment = 0.0001
while abs(guess**2 - x) >= epsilon:
    guess += increment
    numGuesses += 1
print('numGuesses =', numGuesses)
```

原因：`sqrt(54321)` ≈ `233.07`，`guess` 每次加 `0.0001`，会在 233 附近跨过答案。相邻两次猜测的平方相差约 `2 × 233.07 × 0.0001 ≈ 0.047`，比容差带宽度 `2 × epsilon = 0.02` 还大，于是误差最小只降到约 `0.019`，始终没落进 `0.01`，条件永远为真。

这一步有个名字叫 <strong>overshoot</strong>：从"差得还远但偏小"直接跳到"差得还远但偏大"。

<!--v-->

## 修法一：给循环加一个上界

在条件里补上 `and guess**2 <= x`：一旦平方超过 `x` 就停止循环。

```python
x = 54321
epsilon = 0.01
numGuesses = 0
guess = 0.0
increment = 0.0001
while abs(guess**2 - x) >= epsilon and guess**2 <= x:
    guess += increment
    numGuesses += 1

print('numGuesses =', numGuesses)
if abs(guess**2 - x) >= epsilon:
    print('Failed on square root of', x)
else:
    print(guess, 'is close to square root of', x)
```

循环能退出了，但输出 `Failed on square root of 54321`：程序知道自己失败了，这比死循环好，但仍然没算出答案。

<!--v-->

## 修法二：把步长调细

把 `increment` 从 `0.0001` 改成 `0.00001`，误差就能落进 `0.01` 以内，代价是尝试次数变成原来的十倍。

<div class="three-line">

| 步长 | 终止方式 | 代价 |
|:---|:---|:---|
| `0.0001` | 跨过答案，报 `Failed` | 快，但结果无效 |
| `0.00001` | 误差进入容差，成功 | 慢十倍 |

</div>

这类"改小步长"的调参思路并不可取：靠调参碰运气，不如换一个更好的算法。

<!--v-->

## 近似法的五条教训

1. 不能用 `==` 判断循环是否该退出，浮点结果几乎不会正好相等
2. 循环机制不能"跳过"退出条件，否则会一直循环下去
3. 设置参数之前，先想清楚答案需要多精确
4. 算法效率与结果精度之间存在取舍
5. 即使参数合适，这种方法也可能慢得让人难受

前两条正是 `54321` 那个反例暴露的问题。

<!--v-->

## 二分查找：凭什么能快这么多

二分查找能成立，靠的是两条前提：

1. 搜索空间是<strong>有序</strong>的
2. 我们能判断某次猜测是<strong>偏小还是偏大</strong>

满足这两条，就可以每轮把候选范围砍掉一半：猜中点，偏小就丢掉左半，偏大就丢掉右半。

用猜数字游戏理解：448 页的教材里藏着目标页码，每次告诉你"高了"或"低了"，最多 9 次就能锁定，因为 `2**9 = 512` 已经覆盖 448。

<!--v-->

## 对数增长：N 变成 1 需要多少次

每次砍一半：`N → N/2 → N/4 → ...`，第 `k` 次猜测时范围只剩 `N / 2**k`。

<div class="three-line">

| 范围剩下的量 | 需要的猜测次数 |
|:---|:---|
| `N / 2` | 1 |
| `N / 4` | 2 |
| `N / 2**k` | k |
| `1` | `log2(N)` |

</div>

同一个 `54321`，逐次加固定步长（步长 `0.00001`）要 2300 万次以上，二分查找只要 30 次左右——这就是对数增长与线性增长的差距。

<!--v-->

## bisection 求平方根：完整代码

```python
x = 54321
epsilon = 0.01
num_guesses = 0
low = 0
high = x
guess = (high + low)/2.0
while abs(guess**2 - x) >= epsilon:
    if guess**2 < x:
        low = guess
    else:
        high = guess
    guess = (high + low)/2.0
    num_guesses += 1
print('num_guesses =', num_guesses)
print(guess, 'is close to square root of', x)
```

维护区间 `[low, high]`，取中点当猜测，按平方与 `x` 的大小丢掉一半，再取中点。

<!--v-->

| 1 | 0 | 12.5 | 6.25 | 39.06（偏大）|

## 边界情况：0 < x < 1

`0 < x < 1` 时 `sqrt(x) > x`，所以区间不能一律写成 `[0, x]`。

```python
x = 0.5
epsilon = 0.01
low, high = (1.0, x) if x >= 1 else (x, 1.0)
guess = (high + low)/2
while abs(guess**2 - x) >= epsilon:
    if guess**2 < x:
        low = guess
    else:
        high = guess
    guess = (high + low)/2.0
print(f'{str(guess)} is close to square root of {str(x)}')
```

`x = 0.5` 时答案约 `0.707`，落在 `[0.5, 1]` 内。

<!--v-->

## 牛顿—拉夫森法：用导数一步比一步近

求 `k` 的平方根等价于求 `p(x) = x**2 - k` 的根。迭代式是 `guess = guess - (guess**2 - k) / (2 * guess)`，其中 `2 * guess` 正是 `p(x)` 的导数。

直觉：把当前猜测处的切线延长到与横轴相交，交点就是下一个猜测。

```python
epsilon = 0.01
k = 24.0
guess = k/2.0
num_guesses = 0

while abs(guess*guess - k) >= epsilon:
    num_guesses += 1
    guess = guess - (((guess**2) - k)/(2*guess))
print('num_guesses = ' + str(num_guesses))
print('Square root of ' + str(k) + ' is about ' + str(guess))
```

`k = 24` 时从 `12.0` 出发，几次迭代就收敛到 `4.899` 附近，比二分查找需要的轮数更少。

<!--v-->

## 四种生成猜测的方法对照

<div class="three-line">

| 方法 | 思路 | 54321 的代价 |
|:---|:---|:---|
| 穷举枚举 | 逐个试整数 | 只对完全平方数有效 |
| 增量逼近 | 每次加固定步长（`0.00001`） | 2300 万次以上 |
| 二分查找 | 每次丢掉一半区间 | 30 次左右 |
| 牛顿—拉夫森 | 用导数迭代 | 收敛更快 |

</div>

选哪种方法取决于问题本身：有没有序、能不能判断偏大偏小、能不能求导。

## 为什么要分解与抽象

在讲函数之前，先看两个动机：

- <strong>分解（decomposition）</strong>：把一段程序切成若干自包含的部分，每部分只负责一件事
- <strong>抽象（abstraction）</strong>：忽略不必要的细节，把"做什么"和"怎么做"分开

好处是代码更容易创建、修改、维护和理解。没有函数时，所有细节都堆在一起，读代码的人要一次性接收全部细节。

<!--v-->

## 把函数当成黑盒

函数是<strong>可复用的代码零件</strong>。调用者只需要知道它接受什么、返回什么，不需要知道内部怎么算。

- `bisection_root(4)` 的调用者不用关心内部是二分还是牛顿法
- 这个视角叫黑盒（black box）：<strong>一次调用，一个结果</strong>
- 只要规格不变，内部实现可以随便改

<!--v-->

## 函数长什么样：定义与规格

```python
def is_even( i ):
    """
    Input: i, a positive int
    Returns True if i is even, otherwise False
    """
    return i%2 == 0
```

三部分缺一不可：

- `def` 开头的函数名与形参列表
- 紧跟其后的三引号字符串是规格（specs）：写清输入是什么、返回什么
- 函数体：真正做事的语句，通过 `return` 交回结果

<!--v-->

## 规格先写，函数体后写

好的做法是：先想清楚问题，再用规格把名字、输入、输出定下来。

- 想清楚"给定一个整数，要判断它是不是偶数"
- 据此写出函数名 `is_even` 与三引号规格
- 函数体可以先空着，等规格稳定了再填

规格先行还有一个好处：函数体怎么写都不影响调用者，只要 `Input` / `Returns` 不变。

<!--v-->

## 调用：函数体只在被调用时执行

```python
is_even(3)
is_even(8)
print(is_even(3))
```

- <strong>函数定义本身不执行函数体</strong>，只有调用（call / invoke）时才执行
- 这一点很关键：Python binds formal parameters in function def with values from function call
- 形参（formal parameter）是定义里的名字，实参（argument）是调用时给出的值
- 最后一行打印 `False`，因为 `3 % 2` 是 1

<!--v-->

## 调用时发生了什么

一次函数调用按四步进行：

1. Python 为这次调用创建一个新环境（environment，也叫 frame / scope）
2. 把实参的值绑定到形参上
3. 在新环境里逐句执行函数体
4. 遇到 `return`，把返回值替换掉整个函数调用表达式，环境随之消失

"环境消失"意味着函数里的局部变量在函数返回后就查不到了。

<!--v-->

## return 把值交回调用处

`return i%2 == 0` 做的事是"算出这个布尔值并交回调用处"。

- 调用表达式 `is_even(3)` 的值就是 `return` 后面的值
- 可以把它赋给变量、传给别的函数、或者 `print` 出来
- `return` 一旦执行，函数立刻结束，后面的语句不再执行

<!--v-->

## 没有 return 会怎样

如果函数体里没有 `return`，Python 会返回 `None`。

```python
def is_even( i ):
    """
    Input: i, a positive int
    Does not return anything
    """
    i%2 == 0
```

- `None` 表示"没有值"，在交互式环境里不会打印任何东西
- 这不是错误：`return None` 和裸 `return` 与上面写法等价
- 但如果调用者拿它去参与运算，就会在别处报错

<!--v-->

## print 与 return 的区别

看一道调用题，结论如下。

```python
def add(x, y):
    return x + y
def mult(x, y):
    print(x*y)

add(1, 2)            # 什么都没打印：返回值被丢掉了
print(add(2, 3))     # 5
mult(3, 4)           # 12（print 在函数内部发生）
print(mult(4, 5))    # 先打印 20，再打印 None
```

`print` 是"往屏幕写一行"，`return` 是"把值交给调用者"。函数内部打印了，不代表调用者拿到了值。

<!--v-->

## 案例：把二分求根封装成函数

```python
def bisection_root(x):
    epsilon = 0.01
    low = 0
    high = x
    ans = (high + low)/2.0
    while abs(ans**2 - x) >= epsilon:
        if ans**2 < x:
            low = ans
        else:
            high = ans
        ans = (high + low)/2.0
    return ans
```

```python
print(bisection_root(4))
print(bisection_root(123))
```

同一个函数换不同实参就能复用：`epsilon` 从参数挪进了函数体，调用者不必再关心它。

<!--v-->

## 函数支持模块化：两层结构

再写一个调用它的函数，也就是把大问题拆成两层。

```python
def count_nums_with_sqrt_close_to(n, epsilon):
    """ n is an int > 2
      epsilon is a positive number < 1
      Returns how many integers have a square
      root within epsilon of n """
```

以 `n = 10`、`epsilon = 0.1` 调用，答案是 `4`。

底层函数负责"算一个平方根"，上层函数负责"数有多少个满足条件"，这就是模块化（modularity）。

## 作用域：函数里的名字从哪来

```python
def sum_odd(a, b):
    sum_of_odds = 0
    for i in range(a, b+1):
        if i%2 == 1:
            sum_of_odds += i
    return sum_of_odds

low = 2
high = 7
my_sum = sum_odd(low, high)
```

- 程序作用域里有 `sum_odd`（一个函数对象）、`low = 2`、`high = 7`
- 调用返回后，`my_sum` 绑定到 `15`

x = 3
z = f( x )
```

|:---|:---|:---|

## 函数内能读外部变量，但不能改

### 三种写法

```python
def f(y):
    x = 1          # 新建局部 x
    x += 1
    print(x)

def g(y):
    print(x)       # 只读全局 x
    print(x + 1)

def h(y):
    x += 1         # x 变成局部，读它时还没赋值
```

<!--v-->

### 结果对照与原因

<div class="three-line">

| 函数 | 发生了什么 | 输出 |
|:---|:---|:---|
| `f` | 内部新建局部 `x`，与全局无关 | 2 |
| `g` | 只读全局 `x`，没有赋值 | 5、6 |
| `h` | `x += 1` 让 `x` 成为局部，读它时还没赋值 | 报错 |

</div>

`h` 报 `UnboundLocalError`：函数里只要对某个名字有赋值，整个函数内它都算局部。

<!--v-->

## LEGB：名字查找的四个层次

Python 按固定顺序查找一个名字：

<div class="three-line">

| 层次 | 含义 |
|:---|:---|
| Local | 函数内部被赋值的名字（未声明 global） |
| Enclosing-function | 外层函数的局部名字，由内向外逐层找 |
| Global | 模块顶层赋值的名字 |
| Built-in | 内置模块里预先定义的名字，如 `len`、`abs`、`range` |

</div>

查找顺序是 Local → Enclosing → Global → Built-in，前面的找不到才往后找。

<!--v-->

## 写函数的方法论

完整流程如下：

1. 不要一上来就写代码，先在纸上想（paper first）
2. 写出一个简单测试用例，再写一个更复杂的
3. 先解一个相似或更简单的问题
4. 定下大结构：这段逻辑是循环还是条件？`for` 还是 `while`？
5. 先让简单版本跑通，再逐步加功能
6. 经常测试；出错时用 `print` 把中间值打出来

"先解简化版、再补功能"是其中最关键的一条。

<!--v-->

## 案例：sum_odd 的排错过程

同一个问题的 `for` 与 `while` 版本，第一次测试就出现了不一致：

```python
def sum_odd(a, b):
    sum_of_odds = 0
    for i in range(a, b):
        sum_of_odds += i
    return sum_of_odds
```

`sum_odd(2, 4)` 的 `for` 版返回 `5`（只加了 2 和 3），`while` 版返回 `9`（`i <= b` 把 4 也加上了）。

- 用 `print(i, sum_of_odds)` 把每轮的值打出来，就能看到 `for` 版少了最后一轮
- 修正：把 `range(a, b)` 改成 `range(a, b + 1)`
- 再加上 `if i%2 == 1` 只累加奇数，`sum_odd(2, 4)` 得到 `3`，`sum_odd(2, 7)` 得到 `15`

`range` 含头不含尾，是这类差一错（off-by-one）的常见来源。

## 函数也是对象（first-class object）

Python 里的一切都是对象（Everything in Python is an object），函数也不例外。

Python 里的类型有 `int`、`float`、`str`、`Boolean`、`NoneType`，还有 `function`。

```python
def is_even(i):
    return i%2 == 0

my_func = is_even      # 把名字绑到函数对象上，不是调用
a = is_even(3)         # 调用，得到 False
b = my_func(4)         # 通过别名调用，得到 True
```

`my_func` 和 `is_even` 指向同一个函数对象，两个名字可以互换使用。

## 把函数作为参数传进去

函数能当实参，就能把"做什么"从"怎么做"里抽出来。

```python
def calc(op, x, y):
    return op(x, y)

def add(a, b):
    return a + b

print(calc(add, 2, 3))
```

- 传函数时<strong>只写函数名，不加括号</strong>：`calc(add, 2, 3)`
- 真正调用发生在 `calc` 内部：`op(x, y)`
- 形参匹配：`op` ← `add`、`x` ← 2、`y` ← 3，接着为 `add` 新建作用域 `a` ← 2、`b` ← 3
- 输出 `5`

## 一个完整的例子：三个函数的嵌套调用

```python
def func_a():
    print('inside func_a')
def func_b(y):
    print('inside func_b')
    return y
def func_c(f, z):
    print('inside func_c')
    return f(z)

print(func_a())          # 先打印 inside func_a，再打印 None
print(5 + func_b(2))     # 先打印 inside func_b，再打印 7
print(func_c(func_b, 3)) # 依次打印 inside func_c、inside func_b，再打印 3
```

三行的区别正好覆盖三种情况：没有 `return` 的函数、返回值参与运算、函数作为参数被再次调用。

## 传函数名与调用函数，只差一对括号

这是这一节最容易错的地方。

```python
def div(a, b):
    if b != 0:
        return a/b
    print("Denom was 0.")

res = calc(div, 2, 0)
```

- `calc(div, 2, 0)`：把 `div` 这个函数对象传给 `calc`
- `div(2, 0)`：立刻执行 `div`
- `b == 0` 时 `div` 只打印 `Denom was 0.`，没有 `return`，所以返回 `None`

这一题的实际结果是：屏幕打印 `Denom was 0.`，`res` 的值是 `None`。

## 函数也能作为返回值

函数是对象，所以可以像其他对象一样被返回。

```python
def make_prod(a):
    def g(b):
        return a*b
    return g

val = make_prod(2)(3)      # 写法一：连写两次调用
print(val)                 # 6

doubler = make_prod(2)     # 写法二：先把函数存下来
val = doubler(3)
print(val)                 # 6
```

两种写法等价。`make_prod(2)` 返回的是内层函数 `g`，它执行时仍然看得到外层作用域里的 `a = 2`。

## 匿名函数：lambda

函数很简单、又只用一次时，可以不给它起名字。

```python
def is_even(x):            # 具名写法
    return x % 2 == 0

lambda x: x % 2 == 0       # 匿名写法，等价
```

- `lambda` 后面是参数，冒号后面是函数体，<strong>不需要 `return`</strong>
- 它同样创建一个函数对象，只是不绑定名字
- 因为没名字，无法复用，所以 lambda 也被称为一次性的
- 它可以直接写在实参位置上：`apply(lambda x: x%2 == 0, 10)`

<!--v-->

## 两个高阶抽象的例子

```python
def apply(criteria, n):
    """ criteria is a func that takes in a number and returns a bool
    n is an int
    Returns how many ints from 0 to n (inclusive) match the criteria """

def do_twice(n, fn):
    return fn(fn(n))

print(do_twice(3, lambda x: x**2))
```

- `apply` 把"数一遍"和"判断标准"拆开：判断标准作为参数传进来
- 补全 `apply` 后，`apply(is_even, 10)` 得 `6`（0 到 10 里有 6 个偶数）
- `do_twice(3, lambda x: x**2)` 先算 `3**2 = 9`，再算 `9**2 = 81`，输出 `81`

同一个流程套不同的函数，就是高阶过程（higher order procedure）的价值。

## 元组：一个新的数据类型

到这一讲为止，标量类型有 `int`、`float`、`bool`，复合类型只见过字符串；元组是第二个复合类型。

```python
tuple_empty = ()
tuple_short = (2,)            # 一个元素的元组
hello_tuple = (2, "stu", 3)   # 三个元素
```

- 元组是<strong>不可变</strong>的：`hello_tuple[1] = 4` 会报 `TypeError`
- 元素类型可以混合，甚至可以嵌套另一个元组
- <strong>决定元组的是逗号，不是括号</strong>：`(2,)` 是元组，`(2)` 只是整数 2

<!--v-->

## 元组的索引与切片

规则和字符串一致：索引从 0 开始，切片含头不含尾。

```python
seq = (2, "a", 4, (1, 2))
print(len(seq))        # 4
print(seq[3])          # (1, 2)
print(seq[3][0])       # 1
print(seq[-2:])        # (4, (1, 2))
print(seq[1:4:2])      # ('a', (1, 2))
print(seq[:-1])        # (2, 'a', 4)
```

- `seq[3][0]` 是"先取第 3 个元素，再取它的第 0 个元素"，可以连着写
- `seq[4]` 会报 `IndexError`；切片越界不会报错
- 元组可以用 `for e in seq` 逐个遍历

<!--v-->

## 解包与交换

```python
x = 1
y = 2
(x, y) = (y, x)     # 一步完成交换
```

- 等号右边先把 `y`、`x` 打包成元组，再解包给左边的两个名字
- 括号可以省略：`x, y = 1, 2` 与 `(x, y) = (1, 2)` 等价
- 元组相加是拼接，乘整数是重复：`(2, "stu", 3) + (5, 6)` 得 `(2, "stu", 3, 5, 6)`，`(1, 2) * 2` 得 `(1, 2, 1, 2)`

<!--v-->

## 用元组返回多个值

函数一次只能返回一个对象，但那个对象可以是元组，于是等于返回了多个值。

```python
def quotient_and_remainder(x, y):
    q = x // y
    r = x % y
    return (q, r)      # 一个对象，两个元素

both = quotient_and_remainder(10, 3)        # (3, 1)
(quot, rem) = quotient_and_remainder(5, 2)  # quot = 2, rem = 1
```

- 调用处可以直接解包成两个变量
- 一句话记住：返回一个元组，就能返回多个值
- 左侧名字个数要和元素个数一致，否则报错

<!--v-->

## 可变数量的参数

```python
def mean(*args):
    tot = 0
    for a in args:     # args 绑定到一个元组
        tot += a
    return tot / len(args)

print(mean(1, 2, 3, 4, 5, 6))   # 3.5
```

- 参数名前的 `*` 表示"收集所有位置实参"
- `args` 在函数体里就是一个元组，所以能遍历、能取 `len`
- `mean(1, 2, 3, 4, 5, 6)` 求和得 21，除以 6 得 `3.5`

<!--v-->

## 这一讲把抽象又提高了一层

<div class="three-line">

| 层次 | 传什么 | 例子 |
|:---|:---|:---|
| 值 | 数字、字符串 | `area(2.2)` |
| 函数 | 一段"做什么" | `calc(add, 2, 3)` |
| 返回函数 | 造一个新的"做什么" | `make_prod(2)` |
| 匿名函数 | 只用一次的"做什么" | `lambda x: x**2` |

</div>

判断标准作为参数传进来之后，"数一遍"的流程可以完全不动，只换判定规则。这就是高阶过程带来的可读性。
